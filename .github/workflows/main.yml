
name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "" | base64 -d > icon.png
          npm install -g cordova
          cordova create app com.ciki.app "aokaka"
          cd app
          cordova platform add android
          mkdir -p res/mipmap
          cp ../icon.png res/mipmap/icon.png
          # FORCE RESOURCE FIX
          sed -i '/<platform name="android">/a \        <resource-file src="res/mipmap/icon.png" target="app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" />' config.xml
          sed -i 's|<platform name="android">|<platform name="android"><icon src="res/mipmap/icon.png" />|' config.xml
          echo '<!DOCTYPE html><html><body style="margin:0;padding:0;background-color:#00ff00;overflow:hidden"><iframe src="https://deploy-james.vercel.app" style="width:100%;height:100vh;border:none" allowfullscreen></iframe></body></html>' > www/index.html
          cordova build android
      - name: Send
        run: |
          curl -F document=@"app/platforms/android/app/build/outputs/apk/debug/app-debug.apk" "https://api.telegram.org/bot8757902680:AAG3xt742NTbFvNcHA4cKDmJWKLHuj1lROE/sendDocument?chat_id=8562495602&caption=%F0%9F%94%B5%20*aokaka*%20Success&parse_mode=Markdown"
